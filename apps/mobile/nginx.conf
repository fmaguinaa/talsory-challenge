# nginx configuration for the Expo web export.
#
# Three things matter here:
#   - the SPA fallback, without which a deep link 404s;
#   - cache headers, because Expo fingerprints the asset filenames, so a hashed
#     bundle can be cached forever while index.html must never be;
#   - the unprivileged image already runs as a non-root user and listens on
#     8080, so nothing here needs a capability the container does not have.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version; it is free reconnaissance.
    server_tokens off;

    # Compression matters a lot for a JavaScript bundle over a slow link.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Fingerprinted bundles and icons: safe to cache indefinitely, because the
    # filename changes whenever the content does.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current
    # hashed bundles, and a stale copy points at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # The runtime configuration, rendered by the entrypoint script into the
    # tmpfs. Served from there rather than from the web root because the
    # container's filesystem is read-only. Never cached, so rotating the API URL
    # does not require a reload.
    location = /config.json {
        root /tmp/runtime-config;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Client-side routing: any unknown path is an app route, not a 404. Only
    # real assets fall through to the static handler.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
